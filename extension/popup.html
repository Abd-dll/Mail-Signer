<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mail Signer - Connexion</title>
  <style>
    body { font-family: sans-serif; width: 300px; padding: 15px; }
    input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-bottom: 5px; cursor: pointer; }
    .btn-primary { background: #2ecc71; color: white; border: none; }
    .btn-secondary { background: #3498db; color: white; border: none; }
    #status { margin-top: 10px; font-size: 12px; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>Mail Signer PQC</h2>
  
  <div id="login-view">
    <input type="email" id="email" placeholder="Votre email Gmail" required>
    <input type="text" id="username" placeholder="Pseudo (pour Inscription)">
    <input type="password" id="password" placeholder="Mot de passe" required>
    
    <button id="btn-login" class="btn-primary">Se connecter</button>
    <button id="btn-register" class="btn-secondary">S'inscrire</button>
  </div>

  <div id="logged-view" class="hidden">
    <p>✅ Connecté en tant que : <br><strong id="user-display"></strong></p>
    <button id="btn-logout" class="btn-secondary">Se déconnecter</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
